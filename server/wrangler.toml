name = "homepage-modules-license"
main = "src/worker.js"
compatibility_date = "2024-09-23"
# Ed25519 在 Workers 需开启 nodejs_compat 或较新的 compatibility_date；
# WebCrypto Ed25519 在近期 runtime 默认可用。
compatibility_flags = ["nodejs_compat"]

# 部署前先创建 KV：
#   npx wrangler kv namespace create LICENSES
# 把返回的 id 填到下面：
[[kv_namespaces]]
binding = "LICENSES"
id = "<填入 wrangler kv namespace create 返回的 id>"

# Secrets（不要写在此文件，用命令设置）：
#   npx wrangler secret put SIGNING_KEY_PKCS8   # scripts/genkeys.mjs 生成的私钥(base64 pkcs8)
#   npx wrangler secret put ADMIN_SECRET        # 自定义发码口令
